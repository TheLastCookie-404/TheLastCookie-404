name: generate-and-upload-card

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: generate github stats card
        uses: LuciNyan/pixel-profile/action@main
        with:
          github_token: ${{ secrets.PAT_1 }}
          outputs: |
            dist/github-stats?username=TheLastCookie-404&screen_effect=false&theme=fuji&dithering=true
            dist/github-stats-dark?username=TheLastCookie-404&theme=crt
          crt_outputs: |
            dist/github-stats-crt?username=TheLastCookie-404&include_all_commits=true

      - name: push cards to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_1 }}
